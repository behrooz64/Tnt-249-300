name: Build linked manual pages

on:
  push:
    paths:
      - 'docs/source/page-*.md'
      - 'docs/images/index.md'
      - '.github/workflows/build-linked-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linked-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build page-to-image links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_dir = Path("docs/source")
          image_index = Path("docs/images/index.md")
          out_dir = Path("docs/manual-pages")
          out_dir.mkdir(parents=True, exist_ok=True)

          # Map PDF page -> extracted/rendered image paths.
          page_images = {}
          if image_index.exists():
              for line in image_index.read_text(encoding="utf-8").splitlines():
                  m = re.match(r"- Page (\d+): \`([^\`]+)\` \(([^)]+)\)", line)
                  if m:
                      page = int(m.group(1))
                      page_images.setdefault(page, []).append((m.group(2), m.group(3)))

          count = 0
          for src in sorted(source_dir.glob("page-*.md")):
              m = re.search(r"page-(\d+)\\.md$", src.name)
              if not m:
                  continue
              page = int(m.group(1))
              text = src.read_text(encoding="utf-8").strip()

              lines = [
                  f"# Manual page {page}",
                  "",
                  f"> Source: [page-{page:04d}.md](../source/page-{page:04d}.md)",
                  "",
                  "## Page image / diagram",
                  ""
              ]

              for path, kind in page_images.get(page, []):
                  rel = "../" + path.removeprefix("docs/")
                  if kind == "page-render":
                      lines.append(f"![Page {page} render]({rel})")
                      lines.append("")
                  else:
                      lines.append(f"- [{Path(path).name}]({rel})")
                      lines.append("")

              lines += [
                  "## Extracted text",
                  "",
                  text,
                  "",
                  "## Persian notes",
                  "",
                  "<!-- Persian translation/explanation will be added here. -->",
                  ""
              ]

              (out_dir / src.name).write_text("\n".join(lines), encoding="utf-8")
              count += 1

          # Master index
          index_lines = [
              "# Benelli TNT300 Manual - Linked Pages",
              "",
              "Each page combines the extracted English text with the corresponding rendered page image and embedded images.",
              "",
              f"- Pages linked: {count}",
              "",
              "## Pages",
              ""
          ]
          for n in range(1, count + 1):
              index_lines.append(f"- [Page {n}](page-{n:04d}.md)")

          (out_dir / "index.md").write_text("\n".join(index_lines) + "\n", encoding="utf-8")
          print(f"Built {count} linked manual pages.")
          PY

      - name: Commit linked pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual-pages
          git diff --cached --quiet && exit 0
          git commit -m "Link manual text with images and diagrams"
          git push
