name: Build linked manual pages

on:
  push:
    paths:
      - 'docs/source/page-*.md'
      - 'docs/images/index.md'
      - '.github/workflows/build-linked-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linked-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build page-to-image links
        run: python scripts/build_linked_manual.py

      - name: Commit linked pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual-pages
          git diff --cached --quiet && exit 0
          git commit -m "Link manual text with images and diagrams"
          git push
