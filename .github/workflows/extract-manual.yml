name: Extract service manual text

on:
  push:
    paths:
      - 'benelli-tnt300-service-manual-.pdf'
      - '.github/workflows/extract-manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF extractor
        run: python -m pip install --upgrade pymupdf

      - name: Extract text
        run: |
          mkdir -p docs/source
          python - <<'PY'
          import fitz
          from pathlib import Path

          pdf = Path("benelli-tnt300-service-manual-.pdf")
          out = Path("docs/source")
          doc = fitz.open(pdf)

          combined = []
          for i, page in enumerate(doc, 1):
              text = page.get_text("text")
              page_file = out / f"page-{i:04d}.md"
              page_file.write_text(
                  f"# Source page {i}\n\n{text}\n",
                  encoding="utf-8"
              )
              combined.append(f"## Source page {i}\n\n{text}\n")

          (out / "manual-text.md").write_text(
              "# Extracted service manual text\n\n" + "\n".join(combined),
              encoding="utf-8"
          )

          (out / "metadata.txt").write_text(
              f"pages={len(doc)}\n"
              f"source={pdf.name}\n",
              encoding="utf-8"
          )

          print(f"Extracted {len(doc)} pages")
          PY

      - name: Upload extracted text
        uses: actions/upload-artifact@v7
        with:
          name: benelli-tnt300-extracted-text
          path: docs/source/
          retention-days: 90
          compression-level: 6
