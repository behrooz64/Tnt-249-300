name: Deploy TNT249 PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build full manual search index
        run: node scripts/build-manual-index.js
      - uses: actions/configure-pages@v5
      - name: Build Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp -R pwa/. site/
          cp -R docs site/docs
          cp -R data site/data
          node scripts/build-seo-pages.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
