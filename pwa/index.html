<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        await registration.unregister();
      }
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
    } catch (e) {
      console.warn('Cache cleanup:', e);
    }
  });
}
</script>

<script>
function goHome(){
  const q=document.querySelector('#q');
  if(q) q.value='';
  document.querySelector('#detail')?.classList.add('hidden');
  document.querySelector('#pdfViewer')?.classList.add('hidden');
  document.querySelector('#results')?.classList.remove('hidden');
  if(typeof renderHome==='function') renderHome('home');
  if(typeof setPageHeader==='function') setPageHeader('راهنمای تعمیر Benelli TNT 249','خانه');
  document.querySelectorAll('.filters-btn').forEach(x=>x.classList.toggle('active',x.dataset.filter==='home'));
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelector('#homeHeader')?.addEventListener('click',goHome);
document.querySelector('#brandHome')?.addEventListener('click',e=>{e.preventDefault();goHome();});
const darkBtn=document.querySelector('#darkModeToggle');
function setTheme(dark){
  document.body.setAttribute('data-bs-theme',dark?'dark':'light');
  if(darkBtn) darkBtn.innerHTML=dark?'<i class="bi bi-sun"></i>':'<i class="bi bi-moon-stars"></i>';
  localStorage.setItem('tnt249-theme',dark?'dark':'light');
}
setTheme(localStorage.getItem('tnt249-theme')==='dark');
darkBtn?.addEventListener('click',()=>setTheme(document.body.getAttribute('data-bs-theme')!=='dark'));
document.querySelectorAll('.filters-btn').forEach(btn => btn.addEventListener('click', () => {
  const target = document.querySelector('.filters button[data-filter="'+btn.dataset.filter+'"]');
  if (target) target.click();
  document.querySelectorAll('.filters-btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
}));
</script>
