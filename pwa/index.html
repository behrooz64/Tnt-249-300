<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d6efd">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/css/adminlte.rtl.min.css">
<link rel="stylesheet" href="styles.css?v=20261008-adminlte-home-1">
<title>راهنمای تعمیر Benelli TNT 249</title>
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

<header class="app-header navbar navbar-expand bg-body">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="باز کردن منو">
          <i class="bi bi-list"></i>
        </a>
      </li>
    </ul>
    <div class="app-brand-text fw-semibold">راهنمای TNT 249</div>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <button class="nav-link border-0 bg-transparent" data-lte-toggle="dark-mode" type="button" aria-label="تغییر حالت نمایش">
          <i class="bi bi-moon-stars"></i>
        </button>
      </li>
    </ul>
  </div>
</header>

<aside class="app-sidebar bg-dark shadow" data-bs-theme="dark">
  <div class="sidebar-brand">
    <a href="#" class="brand-link" onclick="return false;">
      <i class="bi bi-tools brand-image opacity-75"></i>
      <span class="brand-text fw-light">TNT 249 Manual</span>
    </a>
  </div>
  <div class="sidebar-wrapper">
    <nav class="mt-2">
      <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
        <li class="nav-item">
          <button type="button" class="nav-link active text-start w-100 filters-btn" data-filter="home">
            <i class="nav-icon bi bi-grid-1x2-fill"></i><p>صفحه اصلی</p>
          </button>
        </li>
        <li class="nav-header">دسته‌بندی دفترچه</li>
        <li class="nav-item">
          <button type="button" class="nav-link text-start w-100 filters-btn" data-filter="repair">
            <i class="nav-icon bi bi-wrench-adjustable"></i><p>تعمیرات</p>
          </button>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link text-start w-100 filters-btn" data-filter="manual">
            <i class="nav-icon bi bi-book"></i><p>صفحات دفترچه</p>
          </button>
        </li>
        <li class="nav-item">
          <button type="button" class="nav-link text-start w-100 filters-btn" data-filter="spec">
            <i class="nav-icon bi bi-speedometer2"></i><p>مشخصات فنی</p>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</aside>

<main class="app-main">
  <div class="app-content-header">
    <div class="container-fluid">
      <div class="row align-items-center">
        <div class="col-sm-8">
          <h3 class="mb-0">راهنمای تعمیر Benelli TNT 249</h3>
          <div class="text-body-secondary small mt-1">دفترچه تعمیراتی دیجیتال، فارسی و قابل جست‌وجو</div>
        </div>
        <div class="col-sm-4 mt-2 mt-sm-0">
          <div class="breadcrumb float-sm-end mb-0 small">
            <span>خانه</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="app-content">
    <div class="container-fluid">
      <section class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3 p-md-4">
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-body"><i class="bi bi-search"></i></span>
            <input id="q" type="search" class="form-control" placeholder="جست‌وجوی موضوع، قطعه یا ایراد؛ مثلاً استارت، TPS، ترمز" aria-label="جستجو">
            <button id="clear" class="btn btn-outline-secondary" type="button">پاک کردن</button>
          </div>
        </div>
      </section>

      <div class="filters d-none" aria-hidden="true">
        <button data-filter="home" class="active">موضوعات</button>
        <button data-filter="repair">تعمیرات</button>
        <button data-filter="manual">صفحات دفترچه</button>
        <button data-filter="spec">مشخصات</button>
      </div>

      <div id="status" class="small text-body-secondary mb-2">در حال بارگذاری...</div>
      <section id="results"></section>
      <section id="detail" class="detail hidden"></section>
      <section id="pdfViewer" class="pdf-viewer hidden"></section>

      <div class="alert alert-warning border-0 shadow-sm small mt-3 mb-0">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <b>هشدار منبع:</b> متن اصلی از دفترچه TNT300 است. مقادیر فنی باید با TNT249 تطبیق داده شوند.
      </div>
    </div>
  </div>
</main>

<footer class="app-footer">
  <div class="float-end d-none d-sm-inline">TNT 249</div>
  <strong>راهنمای تعمیراتی دیجیتال</strong>
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/js/adminlte.min.js"></script>
<script src="app.js?v=20261007-2"></script>
<script>
document.querySelectorAll('.filters-btn').forEach(btn => btn.addEventListener('click', () => {
  const target = document.querySelector('.filters button[data-filter="'+btn.dataset.filter+'"]');
  if (target) target.click();
  document.querySelectorAll('.filters-btn').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
}));
</script>
</body>
</html>
